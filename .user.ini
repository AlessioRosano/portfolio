; PHP-Einstellungen für Infomaniak (gilt für diesen Ordner)
; Grössere Uploads für CMS-Bilder und Galerie-Stücke, mehr Zeit für ZIP-Downloads
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
memory_limit = 256M

; Fehler nie im Browser zeigen (verraten sonst Pfade), nur ins Server-Log schreiben
display_errors = Off
log_errors = On
