# Lädt bei jedem Push auf «main» den Code per FTP zu Infomaniak hoch.
# Inhalte (content/, storage/) auf dem Server werden dabei nie angefasst.
#
# Benötigte Secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER       z. B. xxxx.ftp.infomaniak.com
#   FTP_USERNAME     FTP-Benutzer aus dem Infomaniak Manager
#   FTP_PASSWORD     FTP-Passwort
#   ADMIN_PASSWORD   Passwort fürs CMS unter /admin
# Optional:
#   FTP_DIR          Zielordner auf dem Server, z. B. /web/ (Standard: ./)

name: Deploy zu Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CMS-Passwort einrichten
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then echo "::error::Secret ADMIN_PASSWORD fehlt"; exit 1; fi
          php -r '$hash = password_hash(getenv("ADMIN_PASSWORD"), PASSWORD_DEFAULT);
            file_put_contents("api/config.local.php", "<?php\nreturn [\"admin_password_hash\" => " . var_export($hash, true) . "];\n");'

      - name: Per FTP hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || './' }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .vscode/**
            README.md
            content/**
            storage/**
